name: yw-workflow guards
description: >-
  Run the yw-workflow guard rules as a required status check, so they hold on
  the server rather than only on whichever laptop has the hooks installed.

inputs:
  rules:
    description: >-
      Comma-separated rules to run. Any of: claude-md (em-dash and
      negation-then-correction in changed prose), no-ai-attribution (generation
      footers and session URLs in the PR body and changed files), review-gate
      (a non-trivial code diff must carry a review). Default is all three.
    required: false
    default: claude-md,no-ai-attribution,review-gate

runs:
  using: composite
  steps:
    # The guards are a sibling of this action inside the same repo, so the
    # caller gets the exact scripts the hooks run. Resolved once, because a
    # composite step's working directory is the caller's checkout, not ours.
    - name: Locate guards
      shell: bash
      run: echo "YW_HOOKS=$(cd "$GITHUB_ACTION_PATH/../../../hooks" && pwd)" >> "$GITHUB_ENV"

    # Every rule step is gated on contains(inputs.rules, '<name>'), which is a
    # substring match against unvalidated input. `rules: all`, `rules: ""`, or
    # one typo skips every step, and a job whose steps all skip concludes
    # SUCCESS. Branch protection would then show a green required check that
    # ran nothing, which is the exact failure this action exists to prevent.
    - name: Validate rules
      shell: bash
      env:
        RULES: ${{ inputs.rules }}
      run: |
        set -euo pipefail
        if [ -z "${RULES//[[:space:],]/}" ]; then
          echo "rules is empty: the job would pass without running a guard." >&2
          exit 1
        fi
        IFS=','
        for rule in $RULES; do
          case "$(echo "$rule" | tr -d '[:space:]')" in
            claude-md|no-ai-attribution|review-gate) ;;
            "") ;;
            *) echo "unknown rule: $rule (want claude-md, no-ai-attribution, review-gate)" >&2; exit 1 ;;
          esac
        done

    # A PR body and a diff are what these rules read. Without an event payload
    # there is nothing to check, and silently passing would make the required
    # check meaningless, so say so and fail.
    # pull_request_target is deliberately NOT accepted. It hands a privileged
    # token to a workflow whose checkout is usually the PR head, and these steps
    # execute hooks/*.py out of that checkout. On a fork PR that is the author's
    # code running with write scope.
    - name: Require a pull_request event
      shell: bash
      run: |
        if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
          echo "yw-workflow guards run on pull_request events only (got: $GITHUB_EVENT_NAME)." >&2
          exit 1
        fi

    - name: Collect changed files
      shell: bash
      env:
        PR: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # The API list is authoritative and needs no fetch depth, so a shallow
        # default checkout still gives the right file set.
        gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
          --jq '.[] | select(.status != "removed") | .filename' > /tmp/yw-changed.txt
        wc -l < /tmp/yw-changed.txt | xargs echo "changed files:"

    - name: Collect changed prose files
      shell: bash
      run: |
        set -euo pipefail
        : > /tmp/yw-prose.txt
        for suffix in .md .txt; do
          # Only files still present in the tree: a path renamed away would
          # otherwise fail the read and be reported as a finding.
          while IFS= read -r f; do
            [ -f "$f" ] && printf '%s\n' "$f" >> /tmp/yw-prose.txt
          done < <(grep -E "\\${suffix}\$" /tmp/yw-changed.txt || true)
        done
        sort -u -o /tmp/yw-prose.txt /tmp/yw-prose.txt

    - name: claude-md
      if: contains(inputs.rules, 'claude-md')
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -s /tmp/yw-prose.txt ]; then echo "no prose files changed"; exit 0; fi
        xargs -a /tmp/yw-prose.txt -d '\n' "$YW_HOOKS/claude-md-guard.py" scan

    - name: no-ai-attribution
      if: contains(inputs.rules, 'no-ai-attribution')
      shell: bash
      env:
        # Through the environment, never string interpolation: a PR body is
        # attacker-controlled text and inlining it into the script is an
        # injection.
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        set -euo pipefail
        printf '%s' "$PR_BODY" > /tmp/yw-pr-body.txt
        # The PR body plus changed prose, never every changed file. A guard, a
        # test, or a script that quotes the banned footer on purpose is source,
        # and scanning it reports the rule's own documentation as a violation.
        # This repo's own hooks are exactly that case.
        cp /tmp/yw-prose.txt /tmp/yw-attr.txt
        printf '%s\n' /tmp/yw-pr-body.txt >> /tmp/yw-attr.txt
        xargs -a /tmp/yw-attr.txt -d '\n' "$YW_HOOKS/no-ai-attribution.py" scan

    - name: review-gate
      if: contains(inputs.rules, 'review-gate')
      shell: bash
      env:
        PR: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}
      run: |
        "$YW_HOOKS/require-code-review.py" check-pr "$PR"
