name: yw-workflow guards
description: >-
  Run the yw-workflow guard rules as a required status check, so they hold on
  the server rather than only on whichever laptop has the hooks installed.

# There is no input to select a subset of rules. The first version had one, and
# it was the whole of round 1's blocking finding: the steps were gated on
# contains(inputs.rules, '<name>'), a substring match, so one typo skipped every
# step and a job whose steps all skip reports SUCCESS. The validation added to
# close that was itself glob-expanding its input, which reopened it. A consumer
# who wants one rule calls that guard's own entry point in a step of their own.

runs:
  using: composite
  steps:
    # The guards are a sibling of this action inside the same repo, so the
    # caller gets the exact scripts the hooks run. Resolved once, because a
    # composite step's working directory is the caller's checkout, not ours.
    - name: Locate guards
      shell: bash
      run: |
        set -euo pipefail
        echo "YW_HOOKS=$(cd "$GITHUB_ACTION_PATH/../../../hooks" && pwd)" >> "$GITHUB_ENV"
        # RUNNER_TEMP is job-scoped. Fixed /tmp paths are fine on a
        # GitHub-hosted runner, whose VM is single-use, and collide on a
        # self-hosted one running jobs concurrently: two guards jobs share /tmp,
        # one overwrites the other's file list, and the loser scans the wrong
        # set while reporting success. Falling back to /tmp keeps the action
        # working anywhere RUNNER_TEMP is unset.
        echo "YW_TMP=${RUNNER_TEMP:-/tmp}" >> "$GITHUB_ENV"

    # pull_request_target is deliberately NOT accepted. It hands a privileged
    # token to a workflow whose checkout is usually the PR head, and these steps
    # execute hooks/*.py out of that checkout. On a fork PR that is the author's
    # code running with write scope.
    - name: Require a pull_request event
      shell: bash
      run: |
        if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
          echo "yw-workflow guards run on pull_request events only (got: $GITHUB_EVENT_NAME)." >&2
          exit 1
        fi

    - name: Collect changed files
      shell: bash
      env:
        PR: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # The API list is authoritative and needs no fetch depth, so a shallow
        # default checkout still gives the right file set.
        gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
          --jq '.[] | select(.status != "removed") | .filename' > "$YW_TMP/yw-changed.txt"
        wc -l < "$YW_TMP/yw-changed.txt" | xargs echo "changed files:"

    - name: Collect changed prose files
      shell: bash
      run: |
        set -euo pipefail
        : > "$YW_TMP/yw-prose.txt"
        for suffix in .md .txt; do
          # Only files still present in the tree: a path renamed away would
          # otherwise fail the read and be reported as a finding.
          while IFS= read -r f; do
            [ -f "$f" ] && printf '%s\n' "$f" >> "$YW_TMP/yw-prose.txt"
          done < <(grep -E "\\${suffix}\$" "$YW_TMP/yw-changed.txt" || true)
        done
        sort -u -o "$YW_TMP/yw-prose.txt" "$YW_TMP/yw-prose.txt"

    - name: claude-md
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -s "$YW_TMP/yw-prose.txt" ]; then echo "no prose files changed"; exit 0; fi
        xargs -a "$YW_TMP/yw-prose.txt" -d '\n' "$YW_HOOKS/claude-md-guard.py" scan

    - name: no-ai-attribution
      shell: bash
      env:
        # Through the environment, never string interpolation: a PR body is
        # attacker-controlled text and inlining it into the script is an
        # injection.
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        set -euo pipefail
        printf '%s' "$PR_BODY" > "$YW_TMP/yw-pr-body.txt"
        # The PR body plus changed prose, never every changed file. A guard, a
        # test, or a script that quotes the banned footer on purpose is source,
        # and scanning it reports the rule's own documentation as a violation.
        # This repo's own hooks are exactly that case.
        # The body is published text, so a Claude-Session line in it is the
        # violation rather than an exempt commit trailer. Files in the diff keep
        # the exemption, because a commit message quoted in one is legal.
        "$YW_HOOKS/no-ai-attribution.py" scan --published "$YW_TMP/yw-pr-body.txt"
        if [ -s "$YW_TMP/yw-prose.txt" ]; then
          xargs -a "$YW_TMP/yw-prose.txt" -d '\n' "$YW_HOOKS/no-ai-attribution.py" scan
        fi

    - name: review-gate
      shell: bash
      env:
        PR: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}
        # require-code-review.py calls `gh pr view`, which resolves the repo
        # from the git remote. A consumer who checks out with `path:` has no
        # remote in the working directory, and the failure blames the token.
        GH_REPO: ${{ github.repository }}
      run: |
        "$YW_HOOKS/require-code-review.py" check-pr "$PR"
