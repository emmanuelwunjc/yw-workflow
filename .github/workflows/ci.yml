name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited: a PR body changed after the last push is scanned again (#135).
    # It also reruns the check job, at the cost of one run per edit.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  # One job, so branch protection has one required context to name. It runs the
  # exact commands docs/HANDOFF.md calls the gate, because CI that runs
  # something else is a second, undocumented policy.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # tags, and full history to find them. The default is --depth=1
          # --no-tags, which makes `git describe` in check-repo.py return
          # nothing, so the version check would pass forever without ever
          # comparing anything.
          fetch-depth: 0

      - name: Hook self-tests
        run: (for t in ./hooks/*-selftest.*; do "$t" || exit 1; done)

      - name: Repo checks
        run: ./tools/check-repo.py

      # Every PR body opens with an ELI5 section that holds text (see
      # docs/research/orca-issue-pr-style.md). The body goes through the
      # environment, never string interpolation: it is attacker-controlled text.
      - name: PR body starts with ELI5
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./tools/pr_eli5.py

      # A squash-merge body set at merge time (gh pr merge --body, --body-file,
      # or the web UI) is written after the PR checks ran, so they never see it
      # (#135). This scan runs after the text is on main. It cannot block the
      # merge. A failed run shows in the Actions tab. GitHub sends a notice
      # only to an account that turned on Actions notifications. GitHub runs
      # no push workflow when the head commit message holds a skip marker,
      # e.g. `[skip ci]`, or a `skip-checks: true` trailer, or when a
      # GITHUB_TOKEN made the push.
      # The step fails when the message file holds no text (#171). `wc -c`
      # puts the file path and size in the log.
      - name: Scan the head commit message on main
        if: github.event_name == 'push'
        run: |
          msg="$RUNNER_TEMP/yw-head-msg.txt"
          git log -1 --format=%B > "$msg"
          wc -c "$msg"
          grep -q '[^[:space:]]' "$msg" || { echo "::error::$msg holds no text, so nothing was scanned"; exit 1; }
          ./hooks/no-ai-attribution.py scan "$msg"

  # Dogfood: the same action other repos consume, run against this repo's own
  # PRs. A gate nobody runs against themselves is a gate nobody has tested.
  guards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/guards
